<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trattoria Bella Napoli — Voice</title>
  <meta name="description" content="Trattoria Bella Napoli: menu, orari e prenotazione del tavolo a voce.">
  <link rel="stylesheet" href="/site-assets/site.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <header class="topbar">
    <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true">🍅</span>Bella Napoli <small>dal 1987</small></a>
    <nav>
      <a href="#chi-siamo" data-i18n="nav_about"></a>
      <a href="#menu" data-i18n="nav_menu"></a>
      <a href="#prenotazioni" data-i18n="nav_reservations"></a>
      <a href="#dove" data-i18n="nav_where"></a>
      <a href="#contatti" data-i18n="nav_contacts"></a>
      <a href="/staff.html" data-staff hidden data-i18n="nav_staff"></a>
    </nav>
    <button class="btn btn-small" data-open-assistant data-i18n="book_by_voice"></button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="hero-actions">
          <button class="btn" data-open-assistant data-i18n="book_by_voice"></button>
          <button class="btn btn-ghost" type="button" data-open-chat data-i18n="book_by_chat"></button>
          <a class="btn btn-ghost" href="#prenotazioni" data-i18n="check_reservations"></a>
        </div>
      </div>
    </section>

    <section id="chi-siamo" class="section narrow">
      <h2 data-i18n="nav_about"></h2>
      <p data-i18n="about_text"></p>
      <ul class="features">
        <li><span class="ico" aria-hidden="true">🏡</span><strong data-i18n="f1_title"></strong><span data-i18n="f1_text"></span></li>
        <li><span class="ico" aria-hidden="true">🌿</span><strong data-i18n="f2_title"></strong><span data-i18n="f2_text"></span></li>
        <li><span class="ico" aria-hidden="true">🤝</span><strong data-i18n="f3_title"></strong><span data-i18n="f3_text"></span></li>
      </ul>
    </section>

    <section id="menu" class="section">
      <h2 data-i18n="nav_menu"></h2>
      <div class="filters" id="menu-filters" role="group"></div>
      <div id="menu-list" class="menu-list" aria-live="polite" data-i18n="menu_loading"></div>
      <p class="note" data-i18n="menu_note"></p>
    </section>

    <section id="prenotazioni" class="section">
      <h2 data-i18n="nav_reservations"></h2>
      <p data-i18n="res_intro"></p>
      <form id="lookup" class="lookup" autocomplete="off">
        <input id="lookup-code" type="text" maxlength="20" data-i18n-placeholder="lookup_placeholder" aria-label="Codice prenotazione">
        <button class="btn btn-small" type="submit" data-i18n="lookup_button"></button>
        <button class="btn btn-small btn-outline" type="button" id="refresh-all" data-i18n="refresh_all"></button>
      </form>
      <p id="lookup-msg" class="note" role="status"></p>
      <div id="res-list" class="res-list" aria-live="polite"></div>
    </section>

    <section id="dove" class="section">
      <h2 data-i18n="nav_where"></h2>
      <div class="two-col">
        <div>
          <h3 data-i18n="h_address"></h3>
          <p data-info="address">—</p>
          <h3 data-i18n="h_hours"></h3>
          <p data-info="opening_hours">—</p>
          <h3 data-i18n="h_parking"></h3>
          <p data-info="parking">—</p>
        </div>
        <div class="map-wrap">
          <iframe id="map" title="Mappa del ristorante" data-i18n-title="map_title" loading="lazy" referrerpolicy="no-referrer"
                  src="https://www.openstreetmap.org/export/embed.html?bbox=14.2440%2C40.8390%2C14.2560%2C40.8470&amp;layer=mapnik"></iframe>
        </div>
      </div>
    </section>

    <section id="contatti" class="section">
      <h2 data-i18n="contacts_title"></h2>
      <div class="two-col">
        <div>
          <h3 data-i18n="h_phone"></h3>
          <p><a data-info="phone" data-link="tel">—</a></p>
          <h3 data-i18n="h_email"></h3>
          <p><a data-info="email" data-link="mailto">—</a></p>
        </div>
        <div>
          <h3 data-i18n="h_services"></h3>
          <p data-info="services">—</p>
          <h3 data-i18n="h_payments"></h3>
          <p data-info="payment_methods">—</p>
        </div>
      </div>
    </section>

    <!-- shown only when the page is served together with staff.html (showcase gateway / serve.py): hidden on the bare voice server -->
    <section id="staff" class="section" data-staff hidden>
      <h2 data-i18n="staff_title"></h2>
      <div class="staff-box">
        <p data-i18n="staff_text"></p>
        <a class="btn" href="/staff.html" data-i18n="staff_button"></a>
        <p class="staff-note" data-i18n="staff_note"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-brand">🍅 Bella Napoli</p>
    <p class="footer-tag" data-i18n="footer_tag"></p>
    <p><span data-info="name">Trattoria Bella Napoli</span> · <span data-info="address">Via Toledo 142, Napoli</span> · <a href="/prova-vocale" style="color:inherit">pagina di test</a></p>
    <p class="footer-staff" data-staff hidden><a href="/staff.html" data-i18n="staff_footer"></a></p>
  </footer>

  <div class="dock">
    <button id="chat-fab" class="fab fab-chat" type="button" data-open-chat><span aria-hidden="true">💬</span> <span data-i18n="chat_button"></span></button>
    <button id="assistant-fab" class="fab" type="button" data-open-assistant><span aria-hidden="true">🎙️</span> <span data-i18n="book_by_voice"></span></button>
  </div>
  <div id="morph" class="morph" hidden aria-hidden="true"><span id="morph-label" class="lbl"></span></div>
  <div id="orb-wrap" class="orb-wrap"><canvas id="orb" width="520" height="520" role="button" tabindex="0" data-i18n-aria="orb_aria"></canvas></div>
  <p id="orb-note" class="orb-note" role="alert" hidden></p>
  <span id="state" class="state-line" aria-live="polite"></span>

  <section id="chat-panel" class="chat-panel" role="dialog" hidden data-i18n-aria="chat_title">
    <header class="assistant-head">
      <strong data-i18n="chat_title"></strong>
      <button id="chat-close" class="icon-btn" type="button" data-i18n-aria="close">✕</button>
    </header>
    <div id="chat-msgs" class="log" aria-live="polite"></div>
    <form id="chat-form" class="composer" autocomplete="off">
      <input id="chat-input" type="text" maxlength="2000" data-i18n-placeholder="chat_placeholder" data-i18n-aria="chat_placeholder">
      <button class="btn btn-small" type="submit" data-i18n="chat_send"></button>
    </form>
    <button id="chat-reset" class="link-btn" type="button" data-i18n="new_conversation"></button>
  </section>

  <aside id="toast" class="toast" role="status" aria-live="polite" hidden>
    <p id="toast-title" class="toast-title"></p>
    <p id="toast-name" class="toast-name"></p>
    <p id="toast-when" class="toast-when"></p>
    <p id="toast-who" class="toast-who"></p>
  </aside>

  <script src="/site-assets/app.js"></script>
</body>
</html>
