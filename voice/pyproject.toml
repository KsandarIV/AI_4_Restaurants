[project]
name = "voicebot"
# NOTE: keep these dependencies in sync with setup/requirements/*.txt (the shared
# .venv at the repo root is built from those files). Add a package in both places.
version = "1.1.0"
description = "Voice bot for restaurant table booking (Traccia 3) - real-time asyncio audio pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
local-models = [
  "faster-whisper>=1.0",
  "webrtcvad-wheels>=2.0.10",
  "piper-tts>=1.2",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests must run from any cwd and with any interpreter that has the dependencies,
# without `pip install -e` (VS Code often picks the system Python, not .venv).
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "piper.*", "webrtcvad.*", "sounddevice.*", "spacy.*", "winsound", "env_check"]
ignore_missing_imports = true
