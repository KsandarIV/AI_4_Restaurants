[project]
name = "voicebot"
version = "1.0.0"
description = "Voice-bot per prenotazione tavoli (Traccia 3) - pipeline audio real-time asyncio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
local-models = [
  "faster-whisper>=1.0",
  "webrtcvad>=2.0",
  "piper-tts>=1.2",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
